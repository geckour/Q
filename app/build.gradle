plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-parcelize'
    id 'kotlinx-serialization'
    id 'com.google.gms.google-services'
    id 'com.google.devtools.ksp'
}

android {
    namespace "com.geckour.q"

    def keyNameDropBoxAppKey = "DROPBOX_APP_KEY"
    def keyNameDropBoxAppSecret = "DROPBOX_APP_SECRET"

    buildFeatures.buildConfig true

    compileSdk = 37
    defaultConfig {
        applicationId "com.geckour.q"
        minSdk 34
        targetSdk 37
        versionCode 46
        versionName "2.19.0"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        buildConfigField "String", keyNameDropBoxAppKey, getQuotedKey(keyNameDropBoxAppKey, project.rootDir)
        buildConfigField "String", keyNameDropBoxAppSecret, getQuotedKey(keyNameDropBoxAppSecret, project.rootDir)

        def filesAuthorityValue = applicationId + ".files"
        buildConfigField "String", "FILES_AUTHORITY", "\"${filesAuthorityValue}\""

        manifestPlaceholders = [
                dropboxAppKey : "db-" + getKey(keyNameDropBoxAppKey, project.rootDir),
                filesAuthority: filesAuthorityValue
        ]

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
            }
        }
    }
    sourceSets.main {
        jniLibs.srcDir 'src/main/libs'
        // Disable the automatic ndk-build call by Android Studio.
    }
    signingConfigs {
        debug {
            keyAlias "AndroidDebugKey"
            keyPassword "android"
            storeFile file("${project.rootDir}/app/signing/debug.keystore")
            storePassword "android"
        }
        release {
            def releaseSettingGradleFile = new File("${project.rootDir}/app/signing/release.gradle")
            apply from: releaseSettingGradleFile, to: android
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    kotlin {
        compilerOptions {
            freeCompilerArgs.add("-opt-in=kotlin.RequiresOptIn")
        }
    }
    buildFeatures {
        compose true
    }
    ksp {
        arg(new RoomSchemaArgProvider(new File(projectDir, "schemas")))
    }
}

static def getKey(keyName, projectRootDir) {
    Properties props = new Properties()
    props.load(new FileInputStream(new File(projectRootDir, "secret.properties")))
    return props[keyName]
}

static def quoted(value) {
    return "\"" + value + "\""
}

static def getQuotedKey(keyName, projectRootDir) {
    return quoted(getKey(keyName, projectRootDir))
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlinx:kotlinx-collections-immutable:0.5.1"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation "androidx.concurrent:concurrent-futures-ktx:1.3.0"
    testImplementation 'junit:junit:4.13.2'
    testImplementation "com.google.truth:truth:1.4.5"
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    implementation platform('com.google.firebase:firebase-bom:34.18.0')
    implementation("com.google.firebase:firebase-crashlytics")

    // DI
    implementation "io.insert-koin:koin-android:4.2.2"

    // Logging
    implementation 'com.jakewharton.timber:timber:5.0.1'

    // JSON
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"

    // Networking
    def retrofit2_version = "3.0.0"
    def okhttp_version = "5.5.0"
    implementation "com.squareup.retrofit2:retrofit:$retrofit2_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit2_version"
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_version"

    // Preferences
    implementation "androidx.datastore:datastore-preferences:1.2.1"

    // AAC ViewModel
    def aac_lifecycle_ver = '2.11.0'
    implementation "androidx.lifecycle:lifecycle-service:$aac_lifecycle_ver"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$aac_lifecycle_ver"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$aac_lifecycle_ver"
    testImplementation 'androidx.arch.core:core-testing:2.2.0'

    // AAC Room
    def aac_room_ver = '2.8.4'
    implementation "androidx.room:room-runtime:$aac_room_ver"
    implementation "androidx.room:room-ktx:$aac_room_ver"
    implementation "androidx.room:room-paging:$aac_room_ver"
    ksp "androidx.room:room-compiler:$aac_room_ver"
    testImplementation "androidx.room:room-testing:$aac_room_ver"

    // AndroidX
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation "androidx.browser:browser:1.10.0"
    implementation "androidx.window:window:1.5.1"
    implementation "androidx.mediarouter:mediarouter:1.8.1"

    // KTX
    implementation 'androidx.fragment:fragment-ktx:1.9.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation "androidx.core:core-ktx:1.19.0"

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.11.2'

    // Permission
    implementation 'com.github.permissions-dispatcher:ktx:1.1.4'

    // Image processing
    implementation "io.coil-kt:coil-compose:2.7.0"
    implementation "io.coil-kt:coil-svg:2.7.0"

    // Player
    implementation 'androidx.media3:media3-session'
    implementation 'androidx.media3:media3-exoplayer'
    implementation 'androidx.media3:media3-decoder-ffmpeg'
    implementation 'androidx.media3:media3-ui'
    compileOnly 'org.checkerframework:checker-qual:4.2.2'
    compileOnly 'org.checkerframework:checker-compat-qual:2.5.6'

    // Compose
    implementation "androidx.compose.ui:ui:1.12.0"
    implementation "androidx.compose.material3:material3:1.4.0"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"
    debugImplementation "androidx.compose.ui:ui-tooling:1.12.0"
    implementation "androidx.compose.ui:ui-tooling-preview:1.12.0"
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.navigation:navigation-compose:2.9.8"
    implementation "androidx.compose.ui:ui-text-google-fonts:1.12.0"
    implementation "sh.calvin.reorderable:reorderable:3.1.0"
    implementation "androidx.paging:paging-compose:3.5.1"

    // Hash
    implementation 'commons-codec:commons-codec:1.22.1'

    // Dropbox
    implementation 'com.dropbox.core:dropbox-core-sdk:8.0.2'
    implementation 'com.dropbox.core:dropbox-android-sdk:8.0.2'

    // Audio Metadata
    implementation "net.jthink:jaudiotagger:3.0.1"

    // Billing
    implementation "com.android.billingclient:billing-ktx:9.1.0"

    // File Utils
    implementation "commons-io:commons-io:2.22.0"

    // Animation
    implementation "com.airbnb.android:lottie-compose:6.7.1"
}

class RoomSchemaArgProvider implements CommandLineArgumentProvider {

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    File schemaDir

    RoomSchemaArgProvider(File schemaDir) {
        if (!schemaDir.exists()) schemaDir.mkdir()
        this.schemaDir = schemaDir
    }

    @Override
    Iterable<String> asArguments() {
        return ["room.schemaLocation=${schemaDir.path}".toString()]
    }
}

apply plugin: 'com.google.gms.google-services'

apply plugin: 'com.google.firebase.crashlytics'