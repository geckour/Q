plugins {
    id 'com.android.library'
}

android {
    namespace "com.geckour.q.core"

    compileSdk = 37
    defaultConfig {
        minSdk 34
    }
}

dependencies {
    api 'com.jakewharton.timber:timber:5.0.1'
    api platform('com.google.firebase:firebase-bom:34.19.0')
    api 'com.google.firebase:firebase-crashlytics'
}
