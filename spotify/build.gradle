plugins {
    id 'com.android.library'
    id 'kotlinx-serialization'
}

android {
    namespace "com.geckour.q.spotify"

    def keyNameSpotifyClientId = "SPOTIFY_CLIENT_ID"

    buildFeatures.buildConfig true

    compileSdk = 37
    defaultConfig {
        minSdk 34
        consumerProguardFiles 'consumer-rules.pro'

        buildConfigField "String", keyNameSpotifyClientId, "\"${getKey(keyNameSpotifyClientId, project.rootDir) ?: ""}\""
    }
}

static def getKey(keyName, projectRootDir) {
    Properties props = new Properties()
    props.load(new FileInputStream(new File(projectRootDir, "secret.properties")))
    return props[keyName]
}

dependencies {
    api project(':database')

    api "com.spotify.android:auth:5.0.0"
    api(name: 'spotify-app-remote-release-0.8.0', ext: 'aar')
    implementation "com.google.code.gson:gson:2.14.0"

    implementation "androidx.media3:media3-exoplayer:$media3_ver"

    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"
    implementation "com.squareup.okhttp3:okhttp:5.5.0"
    implementation 'com.jakewharton.timber:timber:5.0.1'
}
